name: area303-backend
services:
  postgres:
    image: postgres:16-alpine
    container_name: area303-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-area303}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-area303}
      POSTGRES_DB: ${POSTGRES_DB:-area303}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-area303} -d ${POSTGRES_DB:-area303}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: area303-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: area303-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      # Khoá LLM nằm ở .env gốc (dùng chung cho cả script ngoài Docker), còn
      # cấu hình riêng của backend ở backend/.env. Trước đây chỉ nạp file thứ
      # hai, nên OLLAMA_API_KEY không bao giờ vào container và mọi tính năng
      # cần LLM trả về 503 "not configured".
      #
      # Thứ tự quan trọng: file sau ghi đè file trước, nên backend/.env vẫn là
      # nơi quyết định cuối cùng.
      - ./.env
      - ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      # Inside the compose network Postgres still listens on 5432 — override the
      # host-side POSTGRES_PORT (5433) that backend/.env carries for local runs.
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  postgres_data:
  redis_data:
