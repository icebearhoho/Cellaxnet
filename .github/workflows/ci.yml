name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check .

  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: mypy
        run: mypy app

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: area303
          POSTGRES_PASSWORD: area303
          POSTGRES_DB: area303_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U area303 -d area303_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_ENV: test
      JWT_SECRET: test-secret
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: area303
      POSTGRES_PASSWORD: area303
      POSTGRES_DB: area303_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: alembic upgrade head
        run: alembic upgrade head
      - name: pytest
        run: pytest --maxfail=1 --cov=app --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: backend/coverage.xml
          if-no-files-found: ignore

  build:
    name: Build (docker)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t area303-backend:ci ./backend

  frontend-lint:
    name: Frontend Lint (eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: next lint
        run: npm run lint

  frontend-typecheck:
    name: Frontend Typecheck (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: tsc --noEmit
        run: npm run typecheck

  frontend-build:
    name: Frontend Build (next)
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-typecheck]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: next build
        run: npm run build

  sanity-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Note: pipeline scripts (code/) are kept locally by the data-processing role
      # and aren't part of this repo, so there's no Python to byte-compile here.
      # This job just guards against data files accidentally being committed.
      - name: Check no data files were committed
        run: |
          if git ls-files 'dataset/**/*.csv' 'dataset/**/*.parquet' 'dataset/**/*.xlsx' 'dataset/**/*.zip' | grep -q .; then
            echo "Raw/processed data files must not be committed (see .gitignore)."
            git ls-files 'dataset/**/*.csv' 'dataset/**/*.parquet' 'dataset/**/*.xlsx' 'dataset/**/*.zip'
            exit 1
          fi
