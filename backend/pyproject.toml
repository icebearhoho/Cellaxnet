[project]
name = "area303-backend"
version = "0.1.0"
description = "AREA 303 — FastAPI backend"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "SQLAlchemy>=2.0.36",
    "alembic>=1.13.3",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.9",
    "redis>=5.2.0",
    "python-jose[cryptography]>=3.3.0",
    # Used directly: passlib 1.7.4's backend probe breaks with bcrypt 5.x.
    "bcrypt>=4.0.1,<6.0",
    "python-multipart>=0.0.20",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.1",
    "xgboost>=2.0,<4.0",
    "scikit-learn==1.7.2",
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Only needed with COMPETITOR_USE_SESSION=true. Kept out of the core deps
# because it pulls ~300MB of browser and the collector imports it lazily,
# reporting a clear message when it's absent:
#   pip install -e ".[session]" && playwright install chromium
session = [
    "playwright>=1.48.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts call() in argument defaults; this is
# intentional and safe (they are the framework's markers, not mutable defaults).
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict_optional = true
